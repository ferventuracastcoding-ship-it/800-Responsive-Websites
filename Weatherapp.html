<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>50 State Weather Visualizer</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #07111f;
    --panel: #0d1d31;
    --panel2: #102942;
    --border: #244965;
    --text: #e9f7ff;
    --muted: #8ba8bc;
    --cyan: #42d9ff;
    --blue: #268cff;
    --green: #54e39b;
    --orange: #ffad42;
    --red: #ff6262;
}

body {
    min-height: 100vh;

    font-family:
        "Courier New",
        monospace;

    color: var(--text);

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(0,180,255,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(255,150,40,.10),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #02070e,
            #071728 50%,
            #030b16
        );

    overflow-x: hidden;
}

/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(80,200,255,.6) 1px, transparent 1px);

    background-size:
        80px 80px,
        130px 130px;

    opacity: .15;

    animation:
        stars 30s linear infinite;
}

@keyframes stars {

    from {
        background-position:
            0 0,
            0 0;
    }

    to {
        background-position:
            800px 400px,
            -500px 600px;
    }

}

/* =========================================================
   APP
========================================================= */

.app {
    width: min(1400px, 95%);
    margin: auto;

    position: relative;
    z-index: 2;

    padding:
        25px 0 60px;
}

/* =========================================================
   HEADER
========================================================= */

header {
    text-align: center;

    padding: 25px 10px 30px;
}

header h1 {
    font-size:
        clamp(1.8rem, 5vw, 4rem);

    letter-spacing: 5px;

    color: var(--cyan);

    text-shadow:
        0 0 10px rgba(0,210,255,.8),
        0 0 30px rgba(0,140,255,.5);
}

header p {
    color: var(--muted);

    margin-top: 10px;

    letter-spacing: 2px;
}

/* =========================================================
   CONTROL BAR
========================================================= */

.controls {
    display: grid;

    grid-template-columns:
        1fr 250px 150px;

    gap: 10px;

    margin-bottom: 20px;
}

input,
select,
button {
    width: 100%;

    padding: 13px;

    color: var(--text);

    background: #091827;

    border: 1px solid var(--border);

    border-radius: 8px;

    font-family: inherit;

    outline: none;
}

input:focus,
select:focus {
    border-color: var(--cyan);

    box-shadow:
        0 0 15px rgba(0,200,255,.2);
}

button {
    cursor: pointer;

    font-weight: bold;

    transition: .2s;
}

button:hover {
    background: #12314b;

    border-color: var(--cyan);

    transform: translateY(-2px);
}

/* =========================================================
   MAIN WEATHER PANEL
========================================================= */

.weather-panel {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;

    margin-bottom: 20px;
}

/* =========================================================
   CARD
========================================================= */

.card {
    background:
        linear-gradient(
            145deg,
            rgba(13,29,49,.95),
            rgba(6,18,31,.95)
        );

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 0 30px rgba(0,100,180,.08);
}

.card-title {
    color: var(--cyan);

    font-size: .85rem;

    letter-spacing: 2px;

    margin-bottom: 18px;
}

/* =========================================================
   SELECTED STATE
========================================================= */

.selected-state {
    min-height: 280px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.state-code {
    color: var(--orange);

    font-size: .9rem;

    letter-spacing: 3px;
}

.state-name {
    font-size:
        clamp(2rem, 6vw, 4rem);

    margin: 5px 0;

    color: white;
}

.region {
    color: var(--muted);
}

/* =========================================================
   WEATHER ICON
========================================================= */

.weather-icon {
    width: 100px;
    height: 100px;

    position: relative;

    margin-bottom: 15px;
}

/* SUN */

.sun {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: #ffd34d;

    box-shadow:
        0 0 25px #ffb300,
        0 0 60px rgba(255,170,0,.4);

    position: absolute;

    top: 15px;
    left: 22px;

    animation:
        sunPulse 2s ease-in-out infinite;
}

@keyframes sunPulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

}

/* CLOUD */

.cloud {
    width: 65px;
    height: 25px;

    background: #dcecff;

    border-radius: 30px;

    position: absolute;

    left: 20px;
    bottom: 18px;

    box-shadow:
        18px -13px 0 #eaf6ff,
        35px -5px 0 #eaf6ff;
}

/* RAIN */

.rain {
    position: absolute;

    left: 25px;
    bottom: -5px;

    width: 5px;
    height: 18px;

    background: #36bfff;

    transform: skew(-20deg);

    box-shadow:
        18px 0 #36bfff,
        36px 0 #36bfff;
    
    animation:
        rainFall .7s linear infinite;
}

@keyframes rainFall {

    from {
        transform:
            translateY(-5px)
            skew(-20deg);
    }

    to {
        transform:
            translateY(12px)
            skew(-20deg);
    }

}

/* =========================================================
   TEMPERATURE
========================================================= */

.temperature {
    font-size: 4rem;

    color: #fff;

    text-shadow:
        0 0 20px rgba(80,200,255,.3);
}

.condition {
    color: var(--cyan);

    margin-top: 5px;
}

/* =========================================================
   METRICS
========================================================= */

.metrics {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

.metric {
    padding: 16px;

    border:
        1px solid #193d55;

    background:
        rgba(3,14,25,.8);

    border-radius: 10px;
}

.metric-label {
    display: block;

    color: var(--muted);

    font-size: .7rem;

    margin-bottom: 8px;
}

.metric-value {
    font-size: 1.3rem;

    color: var(--cyan);
}

/* =========================================================
   STATE GRID
========================================================= */

.section {
    background:
        rgba(7,19,32,.9);

    border:
        1px solid var(--border);

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 20px;
}

.section-title {
    color: var(--cyan);

    margin-bottom: 18px;

    letter-spacing: 2px;
}

.state-grid {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 10px;
}

.state-card {
    min-height: 100px;

    padding: 12px;

    border:
        1px solid #1b4058;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            #0c2033,
            #07131f
        );

    cursor: pointer;

    transition:
        transform .2s,
        border .2s,
        box-shadow .2s;
}

.state-card:hover {
    transform:
        translateY(-4px);

    border-color:
        var(--cyan);

    box-shadow:
        0 0 20px rgba(0,200,255,.18);
}

.state-card.active {
    border-color:
        var(--orange);

    box-shadow:
        0 0 20px rgba(255,150,50,.18);
}

.state-abbr {
    color: var(--orange);

    font-weight: bold;
}

.state-card-name {
    margin-top: 5px;

    font-size: .78rem;
}

.state-temp {
    margin-top: 10px;

    color: var(--cyan);

    font-size: .9rem;
}

.state-condition {
    color: var(--muted);

    font-size: .65rem;

    margin-top: 3px;
}

/* =========================================================
   VISUALIZER
========================================================= */

.visualizer {
    height: 180px;

    position: relative;

    overflow: hidden;

    border-radius: 14px;

    border: 1px solid #1d4a63;

    background:
        linear-gradient(
            to bottom,
            #071c38,
            #0b3150 55%,
            #071c20
        );

    margin-top: 15px;
}

/* SUN IN SCENE */

.scene-sun {
    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #ffd34d;

    top: 25px;
    right: 60px;

    box-shadow:
        0 0 30px #ffb300,
        0 0 70px rgba(255,170,0,.5);
}

/* HORIZON */

.horizon {
    position: absolute;

    bottom: 0;

    width: 100%;

    height: 65px;

    background:
        linear-gradient(
            to top,
            #071719,
            #0c2b2a
        );
}

/* CLOUDS */

.scene-cloud {
    position: absolute;

    width: 100px;
    height: 28px;

    border-radius: 30px;

    background: rgba(220,240,255,.8);

    top: 55px;

    animation:
        cloudMove 20s linear infinite;
}

.scene-cloud::before {
    content: "";

    position: absolute;

    width: 40px;
    height: 40px;

    background: inherit;

    border-radius: 50%;

    left: 20px;

    top: -20px;
}

@keyframes cloudMove {

    from {
        left: -120px;
    }

    to {
        left: 110%;
    }

}

/* =========================================================
   DATA TERMINAL
========================================================= */

.terminal {
    height: 200px;

    overflow-y: auto;

    background: #02090f;

    border: 1px solid #163a4e;

    border-radius: 10px;

    padding: 14px;

    font-size: .75rem;
}

.log {
    padding: 6px 0;

    border-bottom:
        1px solid rgba(255,255,255,.04);
}

.log-time {
    color: #557d91;
}

.log-info {
    color: #70eaff;
}

.log-success {
    color: #62ed9d;
}

.log-warning {
    color: #ffb25b;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 1000px) {

    .state-grid {
        grid-template-columns:
            repeat(4, 1fr);
    }

}

@media(max-width: 800px) {

    .weather-panel {
        grid-template-columns: 1fr;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .state-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media(max-width: 550px) {

    .state-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .metrics {
        grid-template-columns: 1fr;
    }

    .temperature {
        font-size: 3rem;
    }

}

</style>
</head>

<body>

<div class="app">

<header>

    <h1>50 STATE WEATHER</h1>

    <p>
        U.S. WEATHER DATA • VISUALIZER • STATE COMMAND CENTER
    </p>

</header>

<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <input
        id="search"
        type="text"
        placeholder="Search state..."
        oninput="filterStates()"
    >

    <select
        id="stateSelect"
        onchange="selectState(this.value)"
    ></select>

    <button onclick="randomState()">
        RANDOM STATE
    </button>

</div>

<!-- =====================================================
     CURRENT WEATHER
===================================================== -->

<div class="weather-panel">

<section class="card selected-state">

    <div class="card-title">
        SELECTED STATE
    </div>

    <div id="weatherIcon"
         class="weather-icon">
    </div>

    <div
        id="stateCode"
        class="state-code">
        CA
    </div>

    <div
        id="stateName"
        class="state-name">
        California
    </div>

    <div
        id="region"
        class="region">
        West
    </div>

    <div
        id="temperature"
        class="temperature">
        72°F
    </div>

    <div
        id="condition"
        class="condition">
        Sunny
    </div>

</section>

<section class="card">

    <div class="card-title">
        LIVE WEATHER METRICS
    </div>

    <div class="metrics">

        <div class="metric">

            <span class="metric-label">
                HUMIDITY
            </span>

            <span
                id="humidity"
                class="metric-value">
                42%
            </span>

        </div>

        <div class="metric">

            <span class="metric-label">
                WIND
            </span>

            <span
                id="wind"
                class="metric-value">
                12 mph
            </span>

        </div>

        <div class="metric">

            <span class="metric-label">
                PRESSURE
            </span>

            <span
                id="pressure"
                class="metric-value">
                1014 hPa
            </span>

        </div>

        <div class="metric">

            <span class="metric-label">
                UV INDEX
            </span>

            <span
                id="uv"
                class="metric-value">
                6
            </span>

        </div>

        <div class="metric">

            <span class="metric-label">
                VISIBILITY
            </span>

            <span
                id="visibility"
                class="metric-value">
                10 mi
            </span>

        </div>

        <div class="metric">

            <span class="metric-label">
                DEW POINT
            </span>

            <span
                id="dewpoint"
                class="metric-value">
                48°F
            </span>

        </div>

    </div>

    <div
        id="visualizer"
        class="visualizer">

        <div class="scene-sun"></div>

        <div class="scene-cloud"></div>

        <div class="horizon"></div>

    </div>

</section>

</div>

<!-- =====================================================
     50 STATES
===================================================== -->

<section class="section">

    <div class="section-title">
        ALL 50 STATES
    </div>

    <div
        id="stateGrid"
        class="state-grid">
    </div>

</section>

<!-- =====================================================
     DATA TERMINAL
===================================================== -->

<section class="section">

    <div class="section-title">
        WEATHER DATA TERMINAL
    </div>

    <div
        id="terminal"
        class="terminal">
    </div>

</section>

</div>

<script>

/* =========================================================
   50 STATES
========================================================= */

const states = [

    ["Alabama","AL","South"],
    ["Alaska","AK","West"],
    ["Arizona","AZ","West"],
    ["Arkansas","AR","South"],
    ["California","CA","West"],
    ["Colorado","CO","West"],
    ["Connecticut","CT","Northeast"],
    ["Delaware","DE","Northeast"],
    ["Florida","FL","South"],
    ["Georgia","GA","South"],
    ["Hawaii","HI","West"],
    ["Idaho","ID","West"],
    ["Illinois","IL","Midwest"],
    ["Indiana","IN","Midwest"],
    ["Iowa","IA","Midwest"],
    ["Kansas","KS","Midwest"],
    ["Kentucky","KY","South"],
    ["Louisiana","LA","South"],
    ["Maine","ME","Northeast"],
    ["Maryland","MD","Northeast"],
    ["Massachusetts","MA","Northeast"],
    ["Michigan","MI","Midwest"],
    ["Minnesota","MN","Midwest"],
    ["Mississippi","MS","South"],
    ["Missouri","MO","Midwest"],
    ["Montana","MT","West"],
    ["Nebraska","NE","Midwest"],
    ["Nevada","NV","West"],
    ["New Hampshire","NH","Northeast"],
    ["New Jersey","NJ","Northeast"],
    ["New Mexico","NM","West"],
    ["New York","NY","Northeast"],
    ["North Carolina","NC","South"],
    ["North Dakota","ND","Midwest"],
    ["Ohio","OH","Midwest"],
    ["Oklahoma","OK","South"],
    ["Oregon","OR","West"],
    ["Pennsylvania","PA","Northeast"],
    ["Rhode Island","RI","Northeast"],
    ["South Carolina","SC","South"],
    ["South Dakota","SD","Midwest"],
    ["Tennessee","TN","South"],
    ["Texas","TX","South"],
    ["Utah","UT","West"],
    ["Vermont","VT","Northeast"],
    ["Virginia","VA","South"],
    ["Washington","WA","West"],
    ["West Virginia","WV","South"],
    ["Wisconsin","WI","Midwest"],
    ["Wyoming","WY","West"]

];


/* =========================================================
   ELEMENTS
========================================================= */

const stateSelect =
    document.getElementById("stateSelect");

const stateGrid =
    document.getElementById("stateGrid");

const terminal =
    document.getElementById("terminal");


/* =========================================================
   WEATHER CONDITIONS
========================================================= */

const conditions = [
    "Sunny",
    "Partly Cloudy",
    "Cloudy",
    "Light Rain",
    "Thunderstorms",
    "Clear",
    "Windy"
];


/* =========================================================
   BASE TEMPERATURES
========================================================= */

const baseTemperatures = {

    West: 72,

    South: 78,

    Midwest: 65,

    Northeast: 61

};


/* =========================================================
   GENERATE WEATHER
========================================================= */

function generateWeather(state) {

    const name =
        state[0];

    const abbreviation =
        state[1];

    const region =
        state[2];

    const base =
        baseTemperatures[region];

    const temperature =
        Math.round(
            base +
            (Math.random() * 30 - 15)
        );

    const humidity =
        Math.round(
            30 +
            Math.random() * 55
        );

    const wind =
        Math.round(
            4 +
            Math.random() * 25
        );

    const pressure =
        Math.round(
            995 +
            Math.random() * 35
        );

    const uv =
        Math.round(
            1 +
            Math.random() * 10
        );

    const visibility =
        Math.round(
            5 +
            Math.random() * 7
        );

    const dewpoint =
        Math.round(
            temperature -
            (100 - humidity) / 5
        );

    const condition =
        conditions[
            Math.floor(
                Math.random() *
                conditions.length
            )
        ];

    return {

        name,
        abbreviation,
        region,

        temperature,

        humidity,

        wind,

        pressure,

        uv,

        visibility,

        dewpoint,

        condition

    };

}


/* =========================================================
   WEATHER DATABASE
========================================================= */

const weatherData = {};

states.forEach(state => {

    weatherData[state[1]] =
        generateWeather(state);

});


/* =========================================================
   BUILD SELECT
========================================================= */

function buildSelect() {

    states.forEach(state => {

        const option =
            document.createElement("option");

        option.value =
            state[1];

        option.textContent =
            `${state[0]} (${state[1]})`;

        stateSelect.appendChild(option);

    });

}


/* =========================================================
   BUILD STATE GRID
========================================================= */

function buildGrid() {

    stateGrid.innerHTML = "";

    states.forEach(state => {

        const data =
            weatherData[state[1]];

        const card =
            document.createElement("div");

        card.className =
            "state-card";

        card.dataset.name =
            data.name.toLowerCase();

        card.dataset.abbreviation =
            data.abbreviation.toLowerCase();

        card.innerHTML = `

            <div class="state-abbr">
                ${data.abbreviation}
            </div>

            <div class="state-card-name">
                ${data.name}
            </div>

            <div class="state-temp">
                ${data.temperature}°F
            </div>

            <div class="state-condition">
                ${data.condition}
            </div>

        `;

        card.onclick = () => {

            selectState(
                data.abbreviation
            );

        };

        stateGrid.appendChild(card);

    });

}


/* =========================================================
   SELECT STATE
========================================================= */

function selectState(abbreviation) {

    const data =
        weatherData[abbreviation];

    if (!data) {
        return;
    }

    stateSelect.value =
        abbreviation;

    document.getElementById(
        "stateCode"
    ).textContent =
        data.abbreviation;

    document.getElementById(
        "stateName"
    ).textContent =
        data.name;

    document.getElementById(
        "region"
    ).textContent =
        data.region;

    document.getElementById(
        "temperature"
    ).textContent =
        `${data.temperature}°F`;

    document.getElementById(
        "condition"
    ).textContent =
        data.condition;

    document.getElementById(
        "humidity"
    ).textContent =
        `${data.humidity}%`;

    document.getElementById(
        "wind"
    ).textContent =
        `${data.wind} mph`;

    document.getElementById(
        "pressure"
    ).textContent =
        `${data.pressure} hPa`;

    document.getElementById(
        "uv"
    ).textContent =
        data.uv;

    document.getElementById(
        "visibility"
    ).textContent =
        `${data.visibility} mi`;

    document.getElementById(
        "dewpoint"
    ).textContent =
        `${data.dewpoint}°F`;

    updateWeatherScene(
        data.condition
    );

    highlightState(
        abbreviation
    );

    addLog(
        `Loaded weather data for ${data.name}.`,
        "info"
    );

}


/* =========================================================
   WEATHER SCENE
========================================================= */

function updateWeatherScene(condition) {

    const scene =
        document.getElementById(
            "visualizer"
        );

    scene.querySelectorAll(
        ".rain"
    ).forEach(el => el.remove());

    const sun =
        scene.querySelector(
            ".scene-sun"
        );

    const cloud =
        scene.querySelector(
            ".scene-cloud"
        );

    if (
        condition.includes("Rain") ||
        condition.includes("Thunder")
    ) {

        sun.style.display =
            "none";

        cloud.style.display =
            "block";

        const rain =
            document.createElement(
                "div"
            );

        rain.className =
            "rain";

        scene.appendChild(rain);

    } else if (
        condition === "Cloudy"
    ) {

        sun.style.display =
            "none";

        cloud.style.display =
            "block";

    } else {

        sun.style.display =
            "block";

        cloud.style.display =
            condition ===
            "Partly Cloudy"
                ? "block"
                : "none";

    }

}


/* =========================================================
   HIGHLIGHT STATE
========================================================= */

function highlightState(abbreviation) {

    document
        .querySelectorAll(
            ".state-card"
        )
        .forEach(card => {

            card.classList.remove(
                "active"
            );

            const text =
                card.querySelector(
                    ".state-abbr"
                ).textContent.trim();

            if (
                text === abbreviation
            ) {

                card.classList.add(
                    "active"
                );

            }

        });

}


/* =========================================================
   SEARCH
========================================================= */

function filterStates() {

    const query =
        document.getElementById(
            "search"
        ).value.toLowerCase();

    document
        .querySelectorAll(
            ".state-card"
        )
        .forEach(card => {

            const matches =
                card.dataset.name
                    .includes(query) ||
                card.dataset.abbreviation
                    .includes(query);

            card.style.display =
                matches
                    ? "block"
                    : "none";

        });

}


/* =========================================================
   RANDOM STATE
========================================================= */

function randomState() {

    const randomIndex =
        Math.floor(
            Math.random() *
            states.length
        );

    selectState(
        states[randomIndex][1]
    );

}


/* =========================================================
   LOGGING
========================================================= */

function addLog(
    message,
    type = "info"
) {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "log";

    const time =
        new Date()
            .toLocaleTimeString();

    row.innerHTML = `

        <span class="log-time">
            [${time}]
        </span>

        <span class="log-${type}">
            ${message}
        </span>

    `;

    terminal.appendChild(row);

    terminal.scrollTop =
        terminal.scrollHeight;

}


/* =========================================================
   INITIALIZATION
========================================================= */

buildSelect();

buildGrid();

selectState("CA");

addLog(
    "50-state weather visualizer initialized.",
    "success"
);

addLog(
    "Weather engine loaded for all 50 states.",
    "success"
);

addLog(
    "Select a state to inspect its weather.",
    "info"
);

</script>
