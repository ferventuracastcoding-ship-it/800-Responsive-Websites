<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Wear</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

header{
    position:fixed;
    top:0;
    width:100%;
    background:#111;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 8%;
    z-index:1000;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    position:relative;
    overflow:hidden;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:120px 8% 80px;
    background:linear-gradient(135deg,#eef2ff,#ffffff);
}

/* Decorative background */
.hero::before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    border-radius:50%;
    background:#6C63FF;
    top:-250px;
    right:-150px;
    opacity:.12;
    z-index:0;
}

/* Decorative accent */
.hero::after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    background:#00C2FF;
    border-radius:50%;
    bottom:-120px;
    left:-80px;
    opacity:.18;
    z-index:0;
}

.hero-text{
    width:48%;
    position:relative;
    z-index:3;
}

.hero-text h1{
    font-size:58px;
    margin-bottom:20px;
}

.hero-text p{
    line-height:1.7;
    margin-bottom:30px;
}

.hero-text button{
    padding:15px 35px;
    border:none;
    background:#111;
    color:white;
    border-radius:40px;
    cursor:pointer;
    font-size:18px;
}

.hero-images{
    position:relative;
    width:460px;
    height:520px;
    z-index:2;
}

/* Main Image */
.img1{
    position:absolute;
    width:300px;
    border-radius:20px;
    top:0;
    left:0;
    z-index:3;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* Overlapping Image */
.img2{
    position:absolute;
    width:260px;
    border-radius:20px;
    bottom:0;
    right:0;
    z-index:2;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* Floating Image */
.img3{
    position:absolute;
    width:180px;
    top:170px;
    right:80px;
    border-radius:20px;
    z-index:4;
    border:8px solid white;
    box-shadow:0 15px 30px rgba(0,0,0,.25);
}

.products{
    max-width:1200px;
    margin:80px auto;
    padding:0 8%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:280px;
    object-fit:cover;
}

.info{
    padding:20px;
}

.price{
    color:#6C63FF;
    font-size:24px;
    font-weight:bold;
    margin:10px 0;
}

.buy{
    width:100%;
    padding:12px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
}

.cart{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#111;
    color:white;
    padding:15px 25px;
    border-radius:40px;
    z-index:999;
}

@media(max-width:900px){

.hero{
    flex-direction:column;
    text-align:center;
}

.hero-text{
    width:100%;
}

.hero-images{
    width:100%;
    height:480px;
    margin-top:40px;
}

}
</style>
</head>

<body>

<header>
<h2>Urban Wear</h2>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">New</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<div class="hero-text">

<h1>Fashion That Stands Out</h1>

<p>
Discover premium streetwear, jackets, hoodies,
shirts, and accessories designed for everyday comfort
with modern style.
</p>

<button>Shop Collection</button>

</div>

<div class="hero-images">

<img class="img1"
src="https://picsum.photos/400/550?random=1">

<img class="img2"
src="https://picsum.photos/350/450?random=2">

<img class="img3"
src="https://picsum.photos/250/300?random=3">

</div>

</section>

<section class="products" id="products"></section>

<div class="cart">
🛒 Cart: <span id="count">0</span>
</div>

<script>

const clothes=[
["Classic Hoodie",65],
["Denim Jacket",95],
["Graphic Tee",35],
["Cargo Pants",58],
["Bomber Jacket",105],
["Oversized Shirt",42],
["Joggers",50],
["Winter Coat",140]
];

let cart=0;

const products=document.getElementById("products");

clothes.forEach((item,index)=>{

products.innerHTML+=`

<div class="card">

<img src="https://picsum.photos/400/500?random=${index+10}">

<div class="info">

<h3>${item[0]}</h3>

<div class="price">$${item[1]}</div>

<button class="buy" onclick="addCart()">
Add To Cart
</button>

</div>

</div>

`;

});

function addCart(){
cart++;
document.getElementById("count").textContent=cart;
}

</script>

</body>
</html>
