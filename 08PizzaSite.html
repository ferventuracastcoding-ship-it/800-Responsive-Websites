<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Pizza</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#fafafa;
color:#222;
}

header{
background:#c62828;
color:white;
padding:25px;
text-align:center;
}

header h1{
font-size:42px;
}

header p{
margin-top:10px;
}

.hero{
background:url("https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1600") center/cover;
height:300px;
display:flex;
justify-content:center;
align-items:center;
}

.hero h2{
background:rgba(0,0,0,.6);
color:white;
padding:20px 40px;
border-radius:10px;
font-size:40px;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:40px 0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:18px;
}

.card h3{
margin-bottom:10px;
color:#b71c1c;
}

.price{
font-size:22px;
font-weight:bold;
margin:12px 0;
}

button{
width:100%;
padding:12px;
background:#e53935;
border:none;
color:white;
font-size:17px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#b71c1c;
}

.cart{
position:fixed;
right:20px;
bottom:20px;
background:#222;
color:white;
padding:15px 25px;
border-radius:50px;
font-size:20px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}
</style>

</head>
<body>

<header>
<h1>🍕 Galaxy Pizza</h1>
<p>Fresh • Hot • Delicious</p>
</header>

<section class="hero">
<h2>20 Signature Pizzas</h2>
</section>

<div class="container">

<div class="grid" id="menu"></div>

</div>

<div class="cart">
🛒 Cart:
<span id="count">0</span>
</div>

<footer>
<h3>Galaxy Pizza</h3>
<p>Open Daily • Fast Delivery • Fresh Ingredients</p>
</footer>

<script>

const pizzas=[
["Margherita",12],
["Pepperoni",14],
["Hawaiian",15],
["BBQ Chicken",16],
["Meat Lovers",18],
["Supreme",17],
["Veggie Delight",15],
["Buffalo Chicken",17],
["Mushroom Feast",14],
["Four Cheese",16],
["Mexican",17],
["Spicy Italian",18],
["Seafood Special",20],
["Chicken Alfredo",18],
["Garlic Lovers",15],
["Spinach Feta",16],
["Bacon Ranch",18],
["Truffle Mushroom",21],
["Pesto Chicken",19],
["Galaxy Special",22]
];

const menu=document.getElementById("menu");
let cart=0;

pizzas.forEach((pizza,index)=>{

menu.innerHTML+=`

<div class="card">

<img src="https://picsum.photos/400/300?random=${index+1}">

<div class="card-content">

<h3>${pizza[0]}</h3>

<p>Stone baked pizza with premium toppings and mozzarella cheese.</p>

<div class="price">$${pizza[1].toFixed(2)}</div>

<button onclick="addCart()">
Add To Cart
</button>

</div>

</div>

`;

});

function addCart(){

cart++;

document.getElementById("count").textContent=cart;

}

</script>

</body>
</html>
